<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globe 自测页（不参与线上发布）</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070f;color:#dce9ff;
    font:13px/1.6 'PingFang SC','Microsoft YaHei',system-ui,sans-serif}
  #hint{position:fixed;left:10px;top:10px;z-index:5;opacity:.55;pointer-events:none}
  #hint b{color:#ffd166}
</style>
</head>
<body>
<div id="hint">globe-test.html —— 仅供 <b>tools/globe-test.mjs</b> 自动化自测使用，不参与线上发布</div>

<script type="module">
// 最小自测页：只引入 globe.js，把断言需要的一切挂到 window 上供 CDP 读取。
import Globe from '../js/ui/globe.js';
import * as constants from '../js/core/constants.js';

const FALLBACK_CITIES = {
  hefei: { id: 'hefei', zh: '合肥', en: 'Hefei', lat: 31.8206, lon: 117.2272 },
  tokyo: { id: 'tokyo', zh: '东京', en: 'Tokyo', lat: 35.6762, lon: 139.6503 },
  beijing: { id: 'beijing', zh: '北京', en: 'Beijing', lat: 39.9042, lon: 116.4074 },
  newyork: { id: 'newyork', zh: '纽约', en: 'New York', lat: 40.7128, lon: -74.006 },
  paris: { id: 'paris', zh: '巴黎', en: 'Paris', lat: 48.8566, lon: 2.3522 },
  melbourne: { id: 'melbourne', zh: '墨尔本', en: 'Melbourne', lat: -37.8136, lon: 144.9631 },
  sydney: { id: 'sydney', zh: '悉尼', en: 'Sydney', lat: -33.8688, lon: 151.2093 },
  reykjavik: { id: 'reykjavik', zh: '雷克雅未克', en: 'Reykjavik', lat: 64.1466, lon: -21.9426 },
  singapore: { id: 'singapore', zh: '新加坡', en: 'Singapore', lat: 1.3521, lon: 103.8198 },
  // 赤道本初子午线：合成贴图的四象限探针用它当终点（相机 settle 在 (0,0)）
  greenwich: { id: 'greenwich', zh: '本初子午线', en: 'Null Island', lat: 0, lon: 0 },
  // 逼近/拉远的定标城市对（坐标同 data/cities.json，cities.json 读不到时也能自测）
  zhuhai: { id: 'zhuhai', zh: '珠海', en: 'Zhuhai', lat: 22.271, lon: 113.5767 },
  macau: { id: 'macau', zh: '澳门', en: 'Macau', lat: 22.1987, lon: 113.5439 },
  guangzhou: { id: 'guangzhou', zh: '广州', en: 'Guangzhou', lat: 23.1291, lon: 113.2644 },
  foshan: { id: 'foshan', zh: '佛山', en: 'Foshan', lat: 23.0218, lon: 113.1219 },
  tianjin: { id: 'tianjin', zh: '天津', en: 'Tianjin', lat: 39.3434, lon: 117.3616 },
  auckland: { id: 'auckland', zh: '奥克兰', en: 'Auckland', lat: -36.8485, lon: 174.7633 },
  madrid: { id: 'madrid', zh: '马德里', en: 'Madrid', lat: 40.4168, lon: -3.7038 },
  london: { id: 'london', zh: '伦敦', en: 'London', lat: 51.5074, lon: -0.1278 },
};

let CITIES = { ...FALLBACK_CITIES };
try {
  const res = await fetch('../data/cities.json');
  if (res.ok) {
    const json = await res.json();
    for (const c of json.cities || []) {
      CITIES[c.id] = { id: c.id, zh: c.zh, en: c.en, lat: Number(c.lat), lon: Number(c.lon) };
    }
  }
} catch (err) {
  console.warn('cities.json 读取失败，用内置城市列表', err);
}

// 测试页在 tools/ 子目录里，而生产页面在仓库根目录。
// 这里显式给绝对 assetBase，既不让子目录影响路径，也仍然走「assetBase 覆盖」这条正常分支。
const ASSET_BASE = new URL('../assets/globe/', location.href).href;
const globe = new Globe(document, { assetBase: ASSET_BASE });
/** globe.js 运行时注入的 <style> id（写成变量，避免被 lint-site 当成 index.html 的必需节点）。 */
const STYLE_ID = 'wr-globe-style';
window.__globe = globe;
window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errors.push('unhandledrejection: ' + String(e.reason)));

/** 造一个经纬度城市（可以超出城市清单，用来压极地/对跖等边界）。 */
function synth(lat, lon, zh, en) {
  return { id: `synth_${lat}_${lon}`, zh: zh || '测试点', en: en || 'Test', lat, lon };
}
window.__synth = synth;
window.__city = (id) => CITIES[id] || null;
window.__cityIds = () => Object.keys(CITIES);

// ────────────────────────────── 逐帧采样：断言「正北朝上」
let sampling = false;
let samples = [];
let skipped = 0;
let samplingGlobe = globe;

function eastOf(dir) {
  const lon = Math.atan2(dir[0], dir[2]);
  return [Math.cos(lon), 0, -Math.sin(lon)];
}
function northTangentOf(dir) {
  const lat = Math.asin(Math.max(-1, Math.min(1, dir[1])));
  const lon = Math.atan2(dir[0], dir[2]);
  return [-Math.sin(lat) * Math.sin(lon), Math.cos(lat), -Math.sin(lat) * Math.cos(lon)];
}
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function takeSample() {
  const g = samplingGlobe;
  // 视口还没建立（数据还在 import / 首帧未跑）时跳过，避免把「没有相机」当成一帧
  const view = g.viewport;
  if (!(view.R > 0)) {
    skipped++;
    return;
  }
  const b = g.cameraBasis();
  const east = eastOf(b.dir);
  const nt = northTangentOf(b.dir);
  const n = g.worldToScreen(90, 0);
  const s = g.worldToScreen(-90, 0);
  samples.push({
    t: performance.now(),
    upEast: Math.abs(dot3(b.up, east)),
    upDir: Math.abs(dot3(b.up, b.dir)),
    upLen: Math.hypot(b.up[0], b.up[1], b.up[2]),
    rightLen: Math.hypot(b.right[0], b.right[1], b.right[2]),
    rightDir: Math.abs(dot3(b.right, b.dir)),
    rightUp: Math.abs(dot3(b.right, b.up)),
    // up 应当恰好等于相机所在地的「正北切向量」
    upVsNorth: Math.max(
      Math.abs(b.up[0] - nt[0]),
      Math.abs(b.up[1] - nt[1]),
      Math.abs(b.up[2] - nt[2]),
    ),
    northY: n ? n.y : null,
    southY: s ? s.y : null,
    // 屏幕 y 向下 ⇒ 北极应比南极小
    poleGap: n && s ? s.y - n.y : null,
    progress: g.state.progress,
    running: g.state.running,
    mode: g.rendererMode,
    // ── 抛物线弹道：逐帧记录相机高度 alt、球占比 ratio、距离 dist（断言用）──
    // 注意 view.alt 而不是 view.h：h 是视口高度，曾被弹道字段撞名过一次（见 __fxClearProbe）
    ratio: view.ratio || 0,
    h: view.alt || 0,
    hMax: view.hMax || 0,
    dist: view.dist || 0,
    arcT: view.t || 0,
    span: view.span || 0,
    R: view.R,
    side: view.side || Math.min(view.w, view.h),
    viewportW: view.w,
    viewportH: view.h,
    winW: innerWidth,
    winH: innerHeight,
    distKm: view.distKm || 0,
  });
}

function rafSample() {
  if (!sampling) return;
  takeSample();
  requestAnimationFrame(rafSample);
}

function summarize() {
  let maxUpEast = 0;
  let maxUpDir = 0;
  let maxUpLenErr = 0;
  let maxRightLenErr = 0;
  let maxRightDir = 0;
  let maxRightUp = 0;
  let maxUpVsNorth = 0;
  let minPoleGap = Infinity;
  let maxPoleGap = -Infinity;
  let nullPoles = 0;
  const modes = new Set();
  for (const s of samples) {
    maxUpEast = Math.max(maxUpEast, s.upEast);
    maxUpDir = Math.max(maxUpDir, s.upDir);
    maxUpLenErr = Math.max(maxUpLenErr, Math.abs(s.upLen - 1));
    maxRightLenErr = Math.max(maxRightLenErr, Math.abs(s.rightLen - 1));
    maxRightDir = Math.max(maxRightDir, s.rightDir);
    maxRightUp = Math.max(maxRightUp, s.rightUp);
    maxUpVsNorth = Math.max(maxUpVsNorth, s.upVsNorth);
    if (s.mode) modes.add(s.mode);
    if (s.poleGap == null) nullPoles++;
    else {
      minPoleGap = Math.min(minPoleGap, s.poleGap);
      maxPoleGap = Math.max(maxPoleGap, s.poleGap);
    }
  }
  const spanMs = samples.length > 1 ? samples[samples.length - 1].t - samples[0].t : 0;

  // ── 抛物线弹道：逐帧 h / ratio / dist 的聚合 ──
  // fitErr：把实测 h 与标准抛物线 hMax·4t(1-t) 比，只统计 t∈[0.05,0.95]（两端 h→0，相对误差无意义）
  let firstRatio = null;
  let lastRatio = null;
  let minRatio = Infinity;
  let maxRatio = -Infinity;
  let firstH = null;
  let lastH = null;
  let peakH = -Infinity;
  let tAtPeak = null;
  let hMaxSeen = 0;
  let maxDRatio = 0;
  let prevRatio = null;
  let fitErr = 0;
  let fitSamples = 0;
  let side = 0;
  let distKm = 0;
  let span = 0;
  let minViewportH = Infinity;
  let minViewportW = Infinity;
  let winH = 0;
  let winW = 0;
  for (const s of samples) {
    if (!(s.ratio > 0)) continue;
    if (firstRatio === null) {
      firstRatio = s.ratio;
      firstH = s.h;
    }
    lastRatio = s.ratio;
    lastH = s.h;
    minRatio = Math.min(minRatio, s.ratio);
    maxRatio = Math.max(maxRatio, s.ratio);
    if (s.h > peakH) {
      peakH = s.h;
      tAtPeak = s.arcT;
    }
    hMaxSeen = Math.max(hMaxSeen, s.hMax);
    if (prevRatio !== null) maxDRatio = Math.max(maxDRatio, Math.abs(s.ratio - prevRatio));
    prevRatio = s.ratio;
    if (s.hMax > 0 && s.arcT >= 0.05 && s.arcT <= 0.95) {
      const pred = s.hMax * 4 * s.arcT * (1 - s.arcT);
      fitErr = Math.max(fitErr, Math.abs(s.h - pred) / pred);
      fitSamples++;
    }
    side = s.side;
    distKm = s.distKm;
    span = s.span;
    // 视口高度必须始终等于窗口高度 —— 弹道字段一旦撞名 h，这里立刻抓到
    if (s.viewportH) minViewportH = Math.min(minViewportH, s.viewportH);
    if (s.viewportW) minViewportW = Math.min(minViewportW, s.viewportW);
    winH = s.winH;
    winW = s.winW;
  }
  const empty = firstRatio === null;
  const range = empty ? 0 : maxRatio - minRatio;
  const insideFrames = empty
    ? 0
    : samples.filter((s) => s.ratio > 0 && s.ratio < maxRatio - range * 0.01 && s.ratio > minRatio + range * 0.01).length;
  const arc = {
    samples: samples.filter((s) => s.ratio > 0).length,
    firstRatio,
    lastRatio,
    minRatio: empty ? null : minRatio,
    maxRatio: empty ? null : maxRatio,
    firstH,
    lastH,
    peakH: empty ? null : peakH,
    tAtPeak,
    hMax: hMaxSeen,
    span,
    side,
    distKm,
    // 抛物线拟合：h 与 hMax·4t(1-t) 的最大相对偏差（只看中段）
    fitErr,
    fitSamples,
    maxDRatio,
    // 抛高 = 最高点的球比贴地时小多少（负数，越负抛得越明显）
    throwRatio: empty || !(maxRatio > 0) ? null : minRatio / maxRatio - 1,
    // 处于两端之间的帧数：为 0 就说明弹道是「瞬间切换」而不是抛物线
    insideFrames,
    // 最高点比例（由 1/相机距离自然得出）与短边的关系
    peakOverSide: empty || !(side > 0) ? null : minRatio,
    arcEndsAtGround: firstH === 0 && lastH === 0,
    // 视口尺寸自检：任何一帧的 viewport.h 都必须等于窗口高度（撞名 bug 的哨兵）
    minViewportH: Number.isFinite(minViewportH) ? minViewportH : 0,
    minViewportW: Number.isFinite(minViewportW) ? minViewportW : 0,
    winH,
    winW,
    viewportOk: Number.isFinite(minViewportH) && minViewportH === winH && minViewportW === winW,
  };

  return {
    count: samples.length,
    skipped,
    spanMs: Math.round(spanMs),
    sampleFps: spanMs > 0 ? Math.round(((samples.length - 1) * 1000) / spanMs) : 0,
    maxUpEast,
    maxUpDir,
    maxUpLenErr,
    maxRightLenErr,
    maxRightDir,
    maxRightUp,
    maxUpVsNorth,
    minPoleGap,
    maxPoleGap,
    nullPoles,
    modes: [...modes],
    arc,
    firstSample: samples[0] || null,
    lastSample: samples[samples.length - 1] || null,
  };
}

// ────────────────────────────── 对外测试 API
window.__result = null;

window.__runTransition = (fromId, toId) => {
  const from = CITIES[fromId];
  const to = CITIES[toId];
  if (!from || !to) return Promise.reject(new Error(`未知城市 ${fromId} / ${toId}`));
  return window.__runPair(from, to);
};

/** 同上，但直接给城市对象（用来压极地 / 对跖等边界）。 */
window.__runPair = (from, to) => window.__runPairOn(globe, from, to);

/** 在指定 Globe 实例上跑一次并逐帧采样（降级路径 / 合成贴图实例用）。 */
window.__runPairOn = (g, from, to) => {
  samples = [];
  skipped = 0;
  samplingGlobe = g;
  sampling = true;
  requestAnimationFrame(rafSample);
  const t0 = performance.now();
  return g.showTransition(from, to).then(() => {
    sampling = false;
    const summary = summarize();
    const r = {
      ms: Math.round(performance.now() - t0),
      runningAfter: g.state.running,
      attachedAfter: g.attached,
      overlayInDom: !!document.querySelector('.wr-globe-overlay'),
      progressAfter: g.state.progress,
      stateFrames: g.state.frames,
      stateFps: g.state.fps,
      rendererMode: g.rendererMode,
      rendererReason: g.rendererReason,
      summary,
    };
    window.__result = r;
    return r;
  });
};

/** 动画进行中途读一次覆盖层的几何/样式信息。 */
window.__overlayInfo = () => {
  const el = document.querySelector('.wr-globe-overlay');
  if (!el) return null;
  const cs = getComputedStyle(el);
  const canvas = el.querySelector('canvas');
  const canvases = [...el.querySelectorAll('canvas')].map((c) => ({
    cls: c.className,
    w: c.width,
    h: c.height,
  }));
  return {
    className: el.className,
    position: cs.position,
    zIndex: cs.zIndex,
    pointerEvents: cs.pointerEvents,
    inset: [cs.top, cs.right, cs.bottom, cs.left].join(','),
    ariaHidden: el.getAttribute('aria-hidden'),
    canvasWidth: canvas ? canvas.width : 0,
    canvasHeight: canvas ? canvas.height : 0,
    canvasClass: canvas ? canvas.className : '',
    canvases,
    opacity: cs.opacity,
    styleTagCount: document.getElementById(STYLE_ID) ? 1 : 0,
    running: globe.state.running,
  };
};

/** 圆盘内 / 可见性正确性：全经纬网格逐点核对。 */
window.__checkDisc = () => {
  const view = globe.viewport;
  if (!(view.R > 0)) return { error: '视口尚未建立（还没跑过 showTransition）' };
  let maxR = 0;
  let visibleMismatch = 0;
  let outsideDisc = 0;
  let nullCount = 0;
  let checked = 0;
  const b = globe.cameraBasis();
  for (let lat = -90; lat <= 90; lat += 3) {
    for (let lon = -180; lon <= 180; lon += 3) {
      const p = globe.worldToScreen(lat, lon);
      if (!p) {
        nullCount++;
        continue;
      }
      checked++;
      const r = Math.hypot(p.nx, p.ny);
      maxR = Math.max(maxR, r);
      const la = (lat * Math.PI) / 180;
      const lo = (lon * Math.PI) / 180;
      const v = [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
      const depth = v[0] * b.dir[0] + v[1] * b.dir[1] + v[2] * b.dir[2];
      if (p.visible !== depth >= 0) visibleMismatch++;
      const dx = p.x - view.cx;
      const dy = p.y - view.cy;
      if (Math.hypot(dx, dy) > view.R * (1 + 1e-9)) outsideDisc++;
    }
  }
  return { checked, nullCount, maxNormRadius: maxR, visibleMismatch, outsideDisc, view };
};

/** 打断场景：中途 cancel()，Promise 也必须 resolve。 */
window.__runCancel = (afterMs = 900) =>
  new Promise((resolve) => {
    const from = CITIES.hefei;
    const to = CITIES.newyork;
    let settled = false;
    const t0 = performance.now();
    const p = globe.showTransition(from, to);
    p.then(() => {
      settled = true;
    });
    setTimeout(() => {
      const settledBeforeCancel = settled;
      const attachedBeforeCancel = globe.attached;
      const cancelAt = performance.now();
      globe.cancel();
      const runningRightAfterCancel = globe.state.running;
      const attachedRightAfterCancel = globe.attached;
      p.then(() => {
        resolve({
          settledBeforeCancel,
          attachedBeforeCancel,
          runningRightAfterCancel,
          attachedRightAfterCancel,
          msAfterCancel: Math.round(performance.now() - cancelAt),
          msTotal: Math.round(performance.now() - t0),
          runningFinal: globe.state.running,
          overlayFinal: !!document.querySelector('.wr-globe-overlay'),
        });
      });
    }, afterMs);
  });

/** 动画进行中再次 showTransition：前一个必须被收掉并 resolve。 */
window.__runOverlap = () =>
  new Promise((resolve) => {
    const t0 = performance.now();
    let p1Done = false;
    let p1DoneAt = 0;
    const p1 = globe.showTransition(CITIES.hefei, CITIES.tokyo);
    p1.then(() => {
      p1Done = true;
      p1DoneAt = performance.now() - t0;
    });
    setTimeout(() => {
      const p2 = globe.showTransition(CITIES.paris, CITIES.melbourne);
      p2.then(() => {
        resolve({
          p1Done,
          p1Ms: Math.round(p1DoneAt),
          p2Ms: Math.round(performance.now() - t0 - 500),
          runningFinal: globe.state.running,
          overlayFinal: !!document.querySelector('.wr-globe-overlay'),
        });
      });
    }, 500);
  });

/** 先起动画、不等待（供测试在中途插检查）。 */
window.__begin = (fromId, toId) => {
  window.__pending = window.__runTransition(fromId, toId);
  return true;
};
window.__beginPair = (from, to) => {
  window.__pending = window.__runPair(from, to);
  return true;
};
window.__awaitPending = () => window.__pending;

// ── 整帧读回 + 快速取像素（一次 readPixels，之后纯 JS 查表）────────────
let _cap = null;
function refreshCapture() {
  _cap = globe.captureFrame();
  return _cap;
}
/** 从整帧缓冲里取一块 size×size 的平均色（坐标是 CSS 像素）。 */
function px(cap, x, y, size = 3) {
  if (!cap) return null;
  const s = cap.scale;
  const cx = Math.round(x * s);
  const cy = Math.round(y * s);
  const half = Math.floor(size / 2);
  let r = 0;
  let g = 0;
  let b = 0;
  let n = 0;
  for (let dy = -half; dy <= half; dy++) {
    for (let dx = -half; dx <= half; dx++) {
      const ix = Math.min(cap.width - 1, Math.max(0, cx + dx));
      const iy = Math.min(cap.height - 1, Math.max(0, cy + dy));
      const row = cap.flipY ? cap.height - 1 - iy : iy;
      const i = (row * cap.width + ix) * 4;
      r += cap.rgba[i];
      g += cap.rgba[i + 1];
      b += cap.rgba[i + 2];
      n++;
    }
  }
  if (!n) return null;
  return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
}

/**
 * 中国红色：像素级对比（相机停在乌鲁木齐，中国 / 蒙古 / 哈萨克斯坦 / 印度同屏）。
 * 控制变量的做法：只取**同一纬度带**上的点，并且用「渲染像素的 R/G ÷ 源贴图同点的 R/G」
 * 把地形本色与光照（都是乘法）约掉，剩下的就是蒙版带来的红移。
 */
window.__chinaRedProbe = async (atMs = 5400) => {
  const from = CITIES.beijing || window.__synth(39.9042, 116.4074, '北京', 'Beijing');
  const to = window.__synth(43.8256, 87.6168, '乌鲁木齐', 'Urumqi');
  const p = window.__runPair(from, to);
  await new Promise((r) => setTimeout(r, atMs));
  const cap = refreshCapture();
  const view = globe.viewport;
  const bands = [33, 41, 47];
  const rows = [];
  for (const lat of bands) {
    for (let lon = -180; lon < 180; lon += 1.5) {
      const id = window.__countryIdAt(lat, lon);
      if (id === null || id === 0) continue;
      const sc = globe.worldToScreen(lat, lon);
      if (!sc || !sc.visible) continue;
      if (Math.hypot(sc.nx, sc.ny) > 0.74) continue; // 只用盘心区域，避开大气边缘光/高光
      const p2 = px(cap, sc.x, sc.y, 3);
      const tex = window.__texelAt(lat, lon, 'albedo');
      if (!p2 || !tex) continue;
      const outRG = (p2[0] + 1) / (p2[1] + 1);
      const texRG = (tex[0] + 1) / (tex[1] + 1);
      rows.push({
        lat,
        lon,
        id,
        rendered: p2,
        texel: tex,
        rg: outRG,
        texRG,
        redShift: outRG / texRG,
      });
    }
  }
  const byCountry = {};
  for (const r of rows) {
    const k = String(r.id);
    if (!byCountry[k]) byCountry[k] = { id: r.id, name: window.__countryNameOf(r.id), n: 0, redShift: 0, rg: 0, texRG: 0 };
    const b = byCountry[k];
    b.n++;
    b.redShift += r.redShift;
    b.rg += r.rg;
    b.texRG += r.texRG;
  }
  const groups = Object.values(byCountry)
    .filter((b) => b.n >= 5)
    .map((b) => ({
      id: b.id,
      name: b.name,
      n: b.n,
      redShift: b.redShift / b.n,
      rg: b.rg / b.n,
      texRG: b.texRG / b.n,
    }))
    .sort((a, b) => b.redShift - a.redShift);
  const cn = groups.find((g) => g.name === 'China') || null;
  const result = {
    bands,
    total: rows.length,
    groups,
    china: cn,
    samples: rows.filter((r) => r.id === (cn ? cn.id : -1)).slice(0, 6),
    info: { rendererMode: globe.rendererMode, chinaId: globe.rendererInfo.chinaId, view: { R: view.R } },
  };
  await p;
  return result;
};

/**
 * 北极伪影探针（要求 2 的验收装置）。
 * 同一帧上截三张图：
 *   A 正常实现（经线在高纬淡出）
 *   B 关掉整个经纬网（grid=0）—— 参照底
 *   C 关掉高纬淡出（gridPoleFade=0）—— 等价于修复前的表现
 * 于是 A−B = 现在经纬网在极地的贡献，C−B = 修复前的贡献。
 * 判据：极地 A−B ≈ 0（风车没了）、C−B 明显 > 0（能复现出风车）、
 *       中纬 A−B 明显 > 0（经纬网在别处照常画着，不是整体删掉）。
 * 顺带统计极冠的颜色分布，用来证明「没有糊成一坨白饼」。
 */
window.__poleProbe = async (atMs = 5400) => {
  const from = window.__synth(0, 0, '赤道', 'Equator');
  const to = window.__synth(89.9, 0, '极点上方', 'OverPole'); // 相机纬度夹到 85
  const p = window.__runPair(from, to);
  await new Promise((r) => setTimeout(r, atMs));
  const view = globe.viewport;

  const grab = (tune) => {
    window.__setTuning(tune);
    return globe.captureFrame();
  };
  const A = grab({ gridPoleFade: 1, grid: null });
  const B = grab({ grid: 0 });
  const C = grab({ gridPoleFade: 0, grid: null });
  window.__setTuning({ gridPoleFade: 1, grid: null });

  const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  const region = (lat0, lat1) => {
    const out = [];
    for (let lat = lat0; lat <= lat1; lat += 1) {
      for (let lon = -180; lon < 180; lon += 1) {
        const sc = globe.worldToScreen(lat, lon);
        if (!sc || !sc.visible) continue;
        if (Math.hypot(sc.nx, sc.ny) > 0.88) continue;
        const a = px(A, sc.x, sc.y, 1);
        const b = px(B, sc.x, sc.y, 1);
        const c = px(C, sc.x, sc.y, 1);
        if (!a || !b || !c) continue;
        out.push({ lat, lon, a, b, c, lum: lum(a) });
      }
    }
    return out;
  };
  const stat = (pts) => {
    let maxNow = 0;
    let maxBefore = 0;
    let sumNow = 0;
    let sumBefore = 0;
    for (const p2 of pts) {
      const dn = Math.max(
        Math.abs(p2.a[0] - p2.b[0]),
        Math.abs(p2.a[1] - p2.b[1]),
        Math.abs(p2.a[2] - p2.b[2]),
      );
      const db = Math.max(
        Math.abs(p2.c[0] - p2.b[0]),
        Math.abs(p2.c[1] - p2.b[1]),
        Math.abs(p2.c[2] - p2.b[2]),
      );
      if (dn > maxNow) maxNow = dn;
      if (db > maxBefore) maxBefore = db;
      sumNow += dn;
      sumBefore += db;
    }
    return {
      n: pts.length,
      maxNow,
      meanNow: pts.length ? sumNow / pts.length : 0,
      maxBefore,
      meanBefore: pts.length ? sumBefore / pts.length : 0,
    };
  };

  const polarPts = region(78, 89);
  const midPts = region(30, 50);
  const lums = polarPts.map((x) => x.lum);
  const bright = lums.filter((v) => v > 150).length;
  const dark = lums.filter((v) => v < 80).length;
  const mean = lums.length ? lums.reduce((x, y) => x + y, 0) / lums.length : 0;
  const std = lums.length
    ? Math.sqrt(lums.reduce((x, y) => x + (y - mean) * (y - mean), 0) / lums.length)
    : 0;
  const iceCap = {
    n: lums.length,
    brightFrac: lums.length ? bright / lums.length : 0,
    darkFrac: lums.length ? dark / lums.length : 0,
    meanLum: mean,
    stdLum: std,
    minLum: lums.length ? Math.min(...lums) : 0,
    maxLum: lums.length ? Math.max(...lums) : 0,
  };
  const result = {
    polar: stat(polarPts),
    mid: stat(midPts),
    iceCap,
    view: { R: view.R, cx: view.cx, cy: view.cy, w: view.w, h: view.h },
    info: { rendererMode: globe.rendererMode, aniso: globe.rendererInfo.aniso },
  };
  await p;
  return result;
};

/** 临时改渲染调参（做「修复前/修复后」对比）。 */
window.__setTuning = (patch) => {
  globe.setTuning(patch);
  return globe.rendererInfo.tuning;
};

/** reduced-motion / 配置读取。 */
window.__debug = () => ({
  supported: globe.supported,
  reducedMotion: globe.reducedMotion,
  config: globe.config,
  /** constants.js 里到底有没有 GLOBE 导出（决定走真实配置还是内置兜底） */
  hasGlobeConst: !!constants.GLOBE,
  globeConst: constants.GLOBE || null,
  state: globe.state,
  rendererMode: globe.rendererMode,
  rendererReason: globe.rendererReason,
  rendererInfo: globe.rendererInfo,
  errors: window.__errors.slice(),
  hasData: !!globe._data,
  landRings: globe._data ? globe._data.LAND.length : 0,
  borderRings: globe._data ? globe._data.BORDERS.length : 0,
});

// ══════════════════════════════════════════════════════════════
// 贴图方向自测装置
// ══════════════════════════════════════════════════════════════
// 「正北朝上」的相机判据抓不到 v 方向画反（南极在上时它依然全绿），
// 所以这里额外验两条：
//   A. 源贴图侧：把北京/东京投到 uv 上采样 countries.png，编号必须是 China / Japan；
//   B. 渲染侧：用**合成四象限贴图**（北半红、南半蓝…）跑一次过场，
//      再读屏幕上四个已知经纬度的像素，色相必须落在对应的象限里。
// B 完全不依赖 assets/globe，任何时候都能跑，且 u/v 方向一起验。

const TEX_URL = (name) => `../assets/globe/${name}`;
const tex = { albedo: null, normal: null, countries: null, palette: null };
let countriesJson = null;
let assetsReady = false;

async function loadSrcTexture(name) {
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error(`贴图读取失败：${name}`));
    img.src = TEX_URL(name);
  });
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  return { canvas: c, ctx: cx, w: c.width, h: c.height };
}

window.__loadAssets = async () => {
  const out = { ok: false, error: null, files: [] };
  try {
    for (const name of ['albedo.jpg', 'normal.jpg', 'countries.png', 'palette.png']) {
      const key = name.split('.')[0];
      tex[key] = await loadSrcTexture(name);
      out.files.push(`${name} ${tex[key].w}×${tex[key].h}`);
    }
    const r = await fetch('../assets/globe/countries.json');
    if (r.ok) countriesJson = await r.json();
    assetsReady = true;
    out.ok = true;
  } catch (err) {
    out.error = String(err && err.message ? err.message : err);
  }
  return out;
};

/** 贴图上的像素（uv 约定：u=(lon+180)/360 西→东，v=(90−lat)/180 北→南）。 */
function texelAt(lat, lon, key) {
  const t = tex[key];
  if (!t) return null;
  const u = (lon + 180) / 360;
  const v = (90 - lat) / 180;
  const x = Math.min(t.w - 1, Math.max(0, Math.floor(u * t.w)));
  const y = Math.min(t.h - 1, Math.max(0, Math.floor(v * t.h)));
  const d = t.ctx.getImageData(x, y, 1, 1).data;
  return [d[0], d[1], d[2], d[3]];
}
window.__texelAt = (lat, lon, key = 'albedo') => texelAt(lat, lon, key);
window.__countryIdAt = (lat, lon) => {
  const p = texelAt(lat, lon, 'countries');
  return p ? p[0] : null;
};
window.__countryNameOf = (id) => {
  if (!countriesJson || !countriesJson.names) return null;
  return countriesJson.names[String(id)] || null;
};
window.__paletteAt = (id) => {
  const t = tex.palette;
  if (!t) return null;
  const d = t.ctx.getImageData(Math.min(255, Math.max(0, id)), 0, 1, 1).data;
  return [d[0], d[1], d[2]];
};
window.__assetsReady = () => assetsReady;

const chroma = (rgb) => {
  const s = rgb[0] + rgb[1] + rgb[2] + 1e-6;
  return [rgb[0] / s, rgb[1] / s, rgb[2] / s];
};
const chromaDist = (a, b) => {
  const x = chroma(a);
  const y = chroma(b);
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
};
window.__chromaDist = chromaDist;

/**
 * 真实贴图的渲染核对：跑到目标城市静止后，逐点读屏幕像素 + 读源贴图，
 * 比较「同点 texel」与「南北镜像 texel」哪个更接近屏幕颜色。
 */
window.__probeTextures = async (fromId = 'beijing', toId = 'tokyo', atMs = 5400) => {
  const from = CITIES[fromId];
  const to = CITIES[toId];
  const points = [
    ['Tibet', 32, 88],
    ['Arabia', 24, 45],
    ['Siberia', 62, 95],
    ['Sichuan', 30, 103],
    ['Australia', -25, 133],
    ['Indian Ocean', -20, 80],
  ];
  const p = window.__runPair(from, to);
  await new Promise((r) => setTimeout(r, atMs));
  const shots = points.map(([name, lat, lon]) => {
    const sc = globe.worldToScreen(lat, lon);
    const px = sc && sc.visible ? globe.sampleScreen(sc.x, sc.y, 5) : null;
    const here = texelAt(lat, lon, 'albedo');
    const flip = texelAt(-lat, lon, 'albedo');
    return {
      name,
      lat,
      lon,
      visible: !!(sc && sc.visible),
      screen: sc ? { x: Math.round(sc.x), y: Math.round(sc.y) } : null,
      rendered: px,
      texel: here,
      flipTexel: flip,
      dHere: px && here ? chromaDist(px, here) : null,
      dFlip: px && flip ? chromaDist(px, flip) : null,
      countryId: (() => {
        const c = texelAt(lat, lon, 'countries');
        return c ? c[0] : null;
      })(),
    };
  });
  const info = {
    rendererMode: globe.rendererMode,
    rendererReason: globe.rendererReason,
    rendererInfo: globe.rendererInfo,
  };
  await p;
  return { shots, info };
};

/** 合成四象限贴图：用来一次性验 u/v 两个方向（不依赖 assets/globe）。 */
function makeQuadrantAlbedo() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 128;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.fillStyle = '#d42a20'; // NW（北半球 + 西经）红
  x.fillRect(0, 0, 128, 64);
  x.fillStyle = '#1fbf4a'; // NE 绿
  x.fillRect(128, 0, 128, 64);
  x.fillStyle = '#2044d8'; // SW 蓝
  x.fillRect(0, 64, 128, 64);
  x.fillStyle = '#e8c81e'; // SE 黄
  x.fillRect(128, 64, 128, 64);
  return c.toDataURL('image/png');
}
function makeFlatNormal() {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = 'rgb(128,128,255)';
  x.fillRect(0, 0, 64, 32);
  return c.toDataURL('image/png');
}
function makeAllLandCountries() {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = 'rgb(1,1,1)'; // 编号 1 = 陆地（顺带把海洋高光关掉）
  x.fillRect(0, 0, 64, 32);
  return c.toDataURL('image/png');
}
function makeWhitePalette() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 1;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, 256, 1);
  return c.toDataURL('image/png');
}

window.__extraGlobes = [];

/** 造一个独立的 Globe 实例（可以强制降级 / 换贴图 / 换数据）。 */
window.__makeGlobe = (opts = {}) => {
  const g = new Globe(document, {
    data: opts.data || { LAND: [], BORDERS: [] },
    forceCanvas2D: opts.forceCanvas2D === true,
    assetBase: opts.assetBase || ASSET_BASE,
    assets: opts.assets,
  });
  window.__extraGlobes.push(g);
  return g;
};

window.__assetBase = () => ASSET_BASE;

/** 默认构造（不传 assetBase）时的贴图目录 —— 必须等于 constants 里的 GLOBE_TEXTURES_DIR。 */
window.__defaultAssetBase = () => new Globe(document, { data: { LAND: [], BORDERS: [] } }).rendererInfo.assets;
window.__globeTexturesDirConst = () =>
  typeof constants.GLOBE_TEXTURES_DIR === 'string' ? constants.GLOBE_TEXTURES_DIR : null;

/**
 * 用合成贴图跑一次过场并读回四个象限的像素。
 * 终点固定在本初子午线与赤道交点，相机静止时 up=正北、right=正东，
 * 于是四个探针点落在屏幕的左上/右上/左下/右下，色相应当与贴图象限一一对应。
 */
window.__quadrantProbe = async (fromId = 'reykjavik', toId = 'greenwich') => {
  const g = window.__makeGlobe({
    assets: {
      albedo: makeQuadrantAlbedo(),
      normal: makeFlatNormal(),
      countries: makeAllLandCountries(),
      palette: makeWhitePalette(),
    },
  });
  const from = CITIES[fromId];
  const to = CITIES[toId];
  // 相机 settle 在 (0,0)：这些点都在可见半球内且不落在 30° 网格线上
  const probes = [
    { name: 'NW', lat: 25, lon: -45, want: [212, 42, 32] },
    { name: 'NE', lat: 25, lon: 45, want: [31, 191, 74] },
    { name: 'SW', lat: -25, lon: -45, want: [32, 68, 216] },
    { name: 'SE', lat: -25, lon: 45, want: [232, 200, 30] },
  ];
  const p = window.__runPairOn(g, from, to);
  await new Promise((r) => setTimeout(r, 5400)); // 5.0s 动画 + 静止段
  const view = g.viewport;
  const shots = probes.map((q) => {
    const sc = g.worldToScreen(q.lat, q.lon);
    const px = sc && sc.visible ? g.sampleScreen(sc.x, sc.y, 7) : null;
    const dists = probes.map((o) => ({ name: o.name, d: px ? chromaDist(px, o.want) : null }));
    let best = null;
    for (const d of dists) if (d.d !== null && (best === null || d.d < best.d)) best = d;
    return {
      name: q.name,
      lat: q.lat,
      lon: q.lon,
      want: q.want,
      visible: !!(sc && sc.visible),
      screen: sc ? { x: Math.round(sc.x), y: Math.round(sc.y) } : null,
      quadrantOfScreen: sc
        ? (sc.y < view.cy ? '上' : '下') + (sc.x < view.cx ? '左' : '右')
        : null,
      rendered: px,
      dWant: px ? chromaDist(px, q.want) : null,
      best,
      dists,
    };
  });
  const info = { rendererMode: g.rendererMode, rendererReason: g.rendererReason };
  await p;
  return { shots, info, view };
};

// ══════════════════════════════════════════════════════════════
// 逼近 / 拉远：像素级实测「画出来的球有多大」
// ══════════════════════════════════════════════════════════════
// 正交投影下球的屏幕轮廓恒为半径 R 的圆。为了**实测**而不是相信 view.R，
// 这里用一张纯红贴图 + 关掉边缘光/高光/经纬网：红盘边界就是球面轮廓。
// 天空是蓝主导、星星接近灰白（r≈b），于是沿球心所在的那一行扫描
// 「R 通道显著大于 B 通道」的连续段，其长度就是实测直径（CSS 像素）。

function makeRedAlbedo() {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = '#ff2a1c';
  x.fillRect(0, 0, 64, 32);
  return c.toDataURL('image/png');
}

/**
 * @param {{atMs?:number, fromId?:string, toId?:string}} opts
 *   atMs：动画开始后多久取帧。2500ms ⇒ 飞行中段（最远处）；5400ms ⇒ 停留段（近景）。
 */
window.__measureDisc = async ({ atMs = 2500, fromId = 'reykjavik', toId = 'singapore' } = {}) => {
  const from = CITIES[fromId];
  const to = CITIES[toId];
  if (!from || !to) return { error: `未知城市 ${fromId} / ${toId}` };
  const g = window.__makeGlobe({
    assets: {
      albedo: makeRedAlbedo(),
      normal: makeFlatNormal(),
      countries: makeAllLandCountries(),
      palette: makeWhitePalette(),
    },
  });
  g.setTuning({ rim: 0, spec: 0, grid: 0 });

  const p = window.__runPairOn(g, from, to);
  await new Promise((r) => setTimeout(r, atMs));
  const cap = g.captureFrame();
  const view = g.viewport;
  const zoom = g.rendererInfo.zoom;

  let scan = null;
  if (cap) {
    const s = cap.scale || 1;
    const rowCss = view.cy;
    const rowBuf = cap.flipY
      ? cap.height - 1 - Math.round(rowCss * s)
      : Math.round(rowCss * s);
    let runLen = 0;
    let best = 0;
    let bestX0 = -1;
    let bestX1 = -1;
    let runStart = -1;
    for (let x = 0; x < cap.width; x++) {
      const i = (rowBuf * cap.width + x) * 4;
      const r = cap.rgba[i];
      const gg = cap.rgba[i + 1];
      const bb = cap.rgba[i + 2];
      const isGlobe = r > gg + 30 && r > bb + 30;
      if (isGlobe) {
        if (runLen === 0) runStart = x;
        runLen++;
        if (runLen > best) {
          best = runLen;
          bestX0 = runStart;
          bestX1 = x;
        }
      } else {
        runLen = 0;
      }
    }
    scan = {
      rowCss,
      scale: s,
      buffer: `${cap.width}×${cap.height}`,
      measuredPx: best / s,
      startX: bestX0 / s,
      endX: bestX1 / s,
      // 起点/终点相对球心的偏差（应当对称，说明扫到的就是球）
      leftGap: view.cx - bestX0 / s,
      rightGap: bestX1 / s - view.cx,
    };
  }

  const out = {
    atMs,
    R: view.R,
    side: view.side,
    distKm: view.distKm,
    ratio: view.ratio,
    h: view.alt,
    hMax: view.hMax,
    dist: view.dist,
    arcT: view.t,
    span: view.span,
    ratioNear: zoom.ratioNear,
    phase: zoom.phase,
    expectedPx: 2 * view.R,
    measuredPx: scan ? scan.measuredPx : null,
    ratioMeasured: scan ? scan.measuredPx / view.side : null,
    ratioExpected: (2 * view.R) / view.side,
    scan,
    rendererMode: g.rendererMode,
    rendererReason: g.rendererReason,
  };
  await p;
  return out;
};

// ── 防回归：前景 fx 图层每帧必须被清空 ────────────────────────
// 背景：弹道字段曾经取名 `h` 并写进 view 对象，把 view.h（视口高度）覆盖成 0.2px，
// 于是 _drawFx 里的 clearRect(0,0,w,h) 只清了一条细缝 —— 画面看不出报错，
// 但大圆弧/标记/标签会在画布上层层累积成"扇面"，截图里一眼可见。
// 判据：往 fx 角落画一个色块，隔两帧它必须消失。
window.__fxClearProbe = async () => {
  const c = document.querySelector('.wr-globe-overlay-fx');
  if (!c) return { ok: false, error: '没有前景画布（动画没在跑？）' };
  const ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ff00ff';
  ctx.fillRect(0, 0, 12, 12);
  const painted = [...ctx.getImageData(5, 5, 1, 1).data];
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const after = [...ctx.getImageData(5, 5, 1, 1).data];
  return {
    ok: true,
    painted,
    after,
    cleared: after[3] < 8 || after[0] !== painted[0] || after[1] !== painted[1],
    canvas: [c.width, c.height],
  };
};

// ── 防回归：2D 降级路径的夜空必须铺满整屏（不是被 view.h 撞名压成一条缝）──
window.__backdropProbe = (g) => {
  const cap = g.captureFrame();
  if (!cap) return null;
  const at = (x, y) => {
    const ix = Math.max(0, Math.min(cap.width - 1, Math.round(x * cap.scale)));
    const iy = Math.max(0, Math.min(cap.height - 1, Math.round(y * cap.scale)));
    const row = cap.flipY ? cap.height - 1 - iy : iy;
    const i = (row * cap.width + ix) * 4;
    return [cap.rgba[i], cap.rgba[i + 1], cap.rgba[i + 2], cap.rgba[i + 3]];
  };
  const v = g.viewport;
  return {
    topLeft: at(6, 6),
    bottomRight: at(v.w - 6, v.h - 6),
    viewport: { w: v.w, h: v.h },
    size: [cap.width, cap.height],
  };
};

// ── 球很大时的边界探针：标签矩形 / 针脚位置 / 像素核对 ──────────
// 老板把两端改成贴地特写（球占短边 86%）后，"球很大"成了新的风险面：
// 标签会不会被挤出画面、针脚是否还压在城市上、可见点是否还在球面圆盘内。
// 判据全部用**当前帧真实画出来的**矩形与像素，而不是把公式重算一遍。
window.__frameProbe = () => {
  const g = window.__globe;
  const run = g._run;
  const v = g.viewport;
  const c = document.querySelector('.wr-globe-overlay-fx');
  if (!run || !c) return { ok: false, error: '没有正在跑的过场' };
  const ctx = c.getContext('2d');
  const px = (x, y) => {
    const ix = Math.max(0, Math.min(c.width - 1, Math.round(x)));
    const iy = Math.max(0, Math.min(c.height - 1, Math.round(y)));
    return [...ctx.getImageData(ix, iy, 1, 1).data];
  };
  const rects = (run.labelRects || []).map((r) => ({
    left: r.left,
    top: r.top,
    right: r.left + r.w,
    bottom: r.top + r.h,
    w: r.w,
    h: r.h,
    zh: r.zh,
    // 四边都在画面内（代码本来就把矩形钳制在 [8, w-8] × [6, h-6] 内）
    inside: r.left >= 0 && r.top >= 0 && r.left + r.w <= v.w && r.top + r.h <= v.h,
  }));
  const dots = (run.markerDots || []).map((d) => ({
    which: d.which,
    x: d.x,
    y: d.y,
    r: d.r,
    color: d.color,
    alpha: d.alpha,
    // 针脚位置要在画面内；这一点的像素必须真被画了东西（标记/标签底）
    inside: d.x >= 0 && d.x <= v.w && d.y >= 0 && d.y <= v.h,
    pixel: px(d.x, d.y),
  }));
  return {
    ok: true,
    R: v.R,
    ratio: v.ratio,
    side: v.side,
    viewport: { w: v.w, h: v.h },
    canvas: { w: c.width, h: c.height },
    rects,
    dots,
    // 照实测 R 反推「球直径 ÷ 短边」，用来核对「两端 = 短边 × 0.86」
    ratioFromR: (2 * v.R) / Math.min(v.w, v.h),
  };
};

/** 球内 / 球外的像素取样，用来确认大球确实画到了它该到的地方。 */
window.__discProbe = () => {
  const g = window.__globe;
  const v = g.viewport;
  const cap = g.captureFrame();
  if (!cap) return null;
  const at = (x, y) => {
    const ix = Math.max(0, Math.min(cap.width - 1, Math.round(x * cap.scale)));
    const iy = Math.max(0, Math.min(cap.height - 1, Math.round(y * cap.scale)));
    const row = cap.flipY ? cap.height - 1 - iy : iy;
    const i = (row * cap.width + ix) * 4;
    return [cap.rgba[i], cap.rgba[i + 1], cap.rgba[i + 2], cap.rgba[i + 3]];
  };
  const r = v.R;
  return {
    R: r,
    ratio: v.ratio,
    side: v.side,
    viewport: { w: v.w, h: v.h },
    insideX: at(v.cx + r * 0.9, v.cy),
    outsideX: at(v.cx + r * 1.1, v.cy),
    insideY: at(v.cx, v.cy + r * 0.9),
    outsideY: at(v.cx, v.cy + r * 1.1),
    diameterOverSide: (2 * r) / v.side,
    fitsOnShortSide: r * 2 <= v.side + 1e-6,
    overflow: Math.max(0, (r * 2) / v.side - 1),
  };
};

// ── 临时改 nearMinSideRatio（**只改内存里的实例配置，不动 constants.js**）──
// 用途：回答「如果老板要球更大 / 溢出画面会怎样」，同时也是"球很大时"边界检查的一部分。
window.__setNearRatio = (v) => {
  const g = window.__globe;
  g._cfg.nearMinSideRatio = Number(v);
  return g._cfg.nearMinSideRatio;
};

/**
 * 把当前过场**摆到落地帧（t=1，两端特写、球最大）并立即探针**。
 * 摆帧与探针必须在同一个 JS 任务里完成 —— 分成两次 eval 的话，中间会被 rAF 覆盖回真实进度。
 * 只用于边界扫描（省掉每次 6.2s 的等待），主验收仍走真实时间轴。
 */
window.__poseCloseUp = () => {
  const g = window.__globe;
  const run = g._run;
  if (!run) return { ok: false, error: '没有正在跑的过场' };
  g._draw(run, run.dur);
  return window.__frameProbe();
};

// ── 强制 WebGL 不可用（模拟老设备 / 驱动黑名单）────────────────
let savedGetContext = null;
window.__forceNoWebGL = (on = true) => {
  const proto = HTMLCanvasElement.prototype;
  if (on) {
    if (savedGetContext) return true;
    savedGetContext = proto.getContext;
    proto.getContext = function patched(type, ...rest) {
      if (String(type).indexOf('webgl') === 0 || type === 'experimental-webgl') return null;
      return savedGetContext.call(this, type, ...rest);
    };
    return true;
  }
  if (savedGetContext) {
    proto.getContext = savedGetContext;
    savedGetContext = null;
  }
  return false;
};

/** 裸 WebGL 能力探测（不经过 globe.js）。 */
window.__webglAvailable = () => {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { ok: false };
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return {
      ok: true,
      version: gl.getParameter(gl.VERSION),
      renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    };
  } catch (err) {
    return { ok: false, error: String(err) };
  }
};

window.__ready = true;
</script>
</body>
</html>
